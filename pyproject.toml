[project]
name = "pyxel-flight-sim"
version = "0.1.0"
description = "Retro flight simulator with procedurally generated terrain, built with Pyxel"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pyxel>=2.9.9",
]

[project.scripts]
flightsim = "flightsim.app:main"
flightsim-map = "flightsim.mapview:main"
flightsim-spike = "flightsim.spike:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
